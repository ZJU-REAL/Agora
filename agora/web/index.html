<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agora · 社交平台</title>
    <link rel="stylesheet" href="/static/native.css" />
    <link rel="stylesheet" href="/static/embed.css" />
    <script src="/static/native.js" defer></script>
    <script src="/static/platform.js" defer></script>
  </head>
  <body>
    <svg class="p-defs" aria-hidden="true">
      <defs>
        <symbol id="p-home" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
        </symbol>
        <symbol id="p-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="7.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="p-plus" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="p-bell" viewBox="0 0 24 24">
          <path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3h4" />
        </symbol>
        <symbol id="p-person" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
        </symbol>
        <symbol id="p-heart" viewBox="0 0 24 24">
          <path
            d="M12 21S2 15 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 7-10 13-10 13Z"
          />
        </symbol>
        <symbol id="p-bookmark" viewBox="0 0 24 24">
          <path d="M6 3h12v18l-6-4-6 4Z" />
        </symbol>
        <symbol id="p-star" viewBox="0 0 24 24">
          <path d="m12 2 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" />
        </symbol>
        <symbol id="p-comment" viewBox="0 0 24 24">
          <path d="M21 11a9 9 0 0 1-9 9H3l2-5a9 9 0 1 1 16-4Z" />
        </symbol>
        <symbol id="p-repost" viewBox="0 0 24 24">
          <path d="m3 8 4-4 4 4M7 4v12h6m8 0-4 4-4-4m4 4V8h-6" />
        </symbol>
        <symbol id="p-share" viewBox="0 0 24 24">
          <path d="M12 16V3m-5 5 5-5 5 5M4 14v7h16v-7" />
        </symbol>
        <symbol id="p-back" viewBox="0 0 24 24">
          <path d="M20 12H4m7-7-7 7 7 7" />
        </symbol>
        <symbol id="p-forward" viewBox="0 0 24 24">
          <path d="M4 12h16m-7-7 7 7-7 7" />
        </symbol>
        <symbol id="p-menu" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </symbol>
        <symbol id="p-close" viewBox="0 0 24 24">
          <path d="m5 5 14 14M5 19 19 5" />
        </symbol>
        <symbol id="p-more" viewBox="0 0 24 24">
          <circle cx="4" cy="12" r="1" />
          <circle cx="12" cy="12" r="1" />
          <circle cx="20" cy="12" r="1" />
        </symbol>
        <symbol id="p-image" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8" cy="8" r="2" />
          <path d="m3 18 6-6 4 4 4-6 4 5" />
        </symbol>
        <symbol id="p-arrow" viewBox="0 0 24 24">
          <path d="m6 15 6-6 6 6" />
        </symbol>
        <symbol id="p-down" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" />
        </symbol>
        <symbol id="p-video" viewBox="0 0 24 24">
          <rect x="3" y="5" width="13" height="14" rx="3" />
          <path d="m16 10 5-4v12l-5-4" />
        </symbol>
        <symbol id="p-pin" viewBox="0 0 24 24">
          <path d="m8 3 9 9-3 3-4-1-4 4-1-1 4-4-1-4Z" />
        </symbol>
      </defs>
    </svg>
    <div class="sandbox-bar" id="sandboxBar">
      <a id="developerLink">Agora sandbox</a><span id="sourceName"></span
      ><label
        >账号
        <select id="userSelect" aria-label="模拟账号"></select></label
      ><button id="newSession">新会话</button><a id="viewerLink">Viewer ↗</a>
    </div>
    <main id="platformRoot" aria-live="polite">
      <div class="p-loading">正在打开平台…</div>
    </main>
    <dialog id="actionDialog" class="p-dialog">
      <form id="actionForm">
        <div class="p-dialog-head">
          <h2 id="dialogTitle"></h2>
          <button type="button" data-dialog-close aria-label="关闭">×</button>
        </div>
        <div id="dialogFields"></div>
        <div class="p-dialog-foot">
          <button type="button" data-dialog-close>取消</button
          ><button class="p-primary" id="dialogSubmit">确定</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="p-toast" role="status"></div>
    <!-- Embedded replay uses same-origin agora:frame messages to select persisted observations. -->
  </body>
</html>
